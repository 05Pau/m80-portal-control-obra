name: Add AVANCE column (one-off)

on:
  workflow_dispatch: {}

jobs:
  add-column:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Agregar columna AVANCE
        env:
          SMARTSHEET_TOKEN: ${{ secrets.SMARTSHEET_TOKEN }}
        run: node scripts/add-avance-column.js
